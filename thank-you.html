<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Thank You – MyEVReport</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fa;
      color: #1f2933;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .box {
      background: #fff;
      padding: 2.5rem;
      max-width: 600px;
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(15, 76, 129, 0.08);
      text-align: center;
    }
    h1 {
      font-size: 1.9rem;
      margin-bottom: 0.75rem;
      color: #0f4c81;
    }
    p {
      font-size: 1rem;
      color: #6b7380;
      line-height: 1.55;
      margin-bottom: 1.5rem;
    }
    a.btn {
      display: inline-block;
      background: #0f4c81;
      color: #fff;
      padding: 0.75rem 1.6rem;
      border-radius: 999px;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 8px 20px rgba(15, 76, 129, 0.2);
      transition: background 0.2s ease;
    }
    a.btn:hover {
      background: #0b355a;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>Thank you!</h1>
    <p>
      We’ve received your EV battery report request and our team will review your details shortly.
      You’ll receive a confirmation email once we’ve checked availability for your chosen date and location.
    </p>
    <a class="btn" href="https://myevreport.com/">Back to home</a>
  </div>
</body>
</html>
